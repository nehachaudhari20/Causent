[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "causent"
version = "0.1.0"
description = "Causent — execution assurance for agentic payments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0"]

[tool.setuptools.packages.find]
where = ["."]
include = [
  "adapters*",
  "assurance*",
  "correlation*",
  "evidence*",
  "storage*",
  "drunix*",
  "api*",
  "simulator*",
  "evaluation*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
